name: flutter_clicker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  forui: ^0.24.3
  hotkey_manager: ^0.2.3
  hugeicons: ^1.1.7
  nutdart: ^0.0.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  forui_cli: ^0.24.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
